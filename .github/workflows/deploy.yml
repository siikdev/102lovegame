# GitHub Pages 배포 — main push 마다 자동.
# 비밀값(frontend/app/env.js)은 리포에 없으므로 배포 시점에 Actions Secrets 로 생성해 주입한다.
# 필요한 Secrets (Settings → Secrets and variables → Actions):
#   SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY
# Pages 소스는 Settings → Pages 에서 "GitHub Actions" 로 설정해야 한다.
name: Deploy Pages
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Secrets 로 env.js 생성 (리포엔 없는 파일)
        run: |
          cat > frontend/app/env.js <<EOF
          /* CI 생성 — Actions Secrets 주입 */
          export const ENV = {
            SUPABASE_URL: '${{ secrets.SUPABASE_URL }}',
            SUPABASE_PUBLISHABLE_KEY: '${{ secrets.SUPABASE_PUBLISHABLE_KEY }}',
          };
          EOF

      - name: 사이트 루트 조립 — frontend/ 를 루트로 (URL 에서 /frontend 제거)
        run: |
          mkdir dist
          cp -r frontend/* dist/
          cp -r legacy dist/legacy
          # 옛 /frontend/ 링크 호환용 리다이렉트
          mkdir -p dist/frontend
          printf '<!DOCTYPE html><meta charset="utf-8"><meta http-equiv="refresh" content="0; url=../">' > dist/frontend/index.html

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: 'dist'
      - id: deployment
        uses: actions/deploy-pages@v4
